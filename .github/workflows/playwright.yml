# .github/workflows/playwright.yml
# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions CI workflow for Playwright Automation Framework.
# Triggers: push / PR to main & develop.
# Jobs:
#   1. test-chromium  — smoke suite on Chromium
#   2. test-cross-browser  — full regression on Firefox & WebKit
#   3. test-api  — API-only tests
# Publishes HTML report as a GitHub Pages artifact.
# ─────────────────────────────────────────────────────────────────────────────

name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Allow manual triggers from the Actions tab
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test (chromium|firefox|webkit|all)'
        required: false
        default: 'chromium'
      tags:
        description: 'Grep tag filter (e.g. @smoke)'
        required: false
        default: ''

env:
  NODE_VERSION: '20'
  BASE_URL: ${{ secrets.BASE_URL || 'https://the-internet.herokuapp.com' }}
  API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://reqres.in/api' }}
  VALID_USERNAME: ${{ secrets.VALID_USERNAME || 'tomsmith' }}
  VALID_PASSWORD: ${{ secrets.VALID_PASSWORD || 'SuperSecretPassword!' }}
  HEADLESS: 'true'
  LOG_LEVEL: 'info'

jobs:
  # ── Job 1: Smoke tests on Chromium ─────────────────────────────────────────
  test-smoke:
    name: Smoke Tests — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Create .env file
        run: |
          cat > .env << EOF
          BASE_URL=${{ env.BASE_URL }}
          API_BASE_URL=${{ env.API_BASE_URL }}
          VALID_USERNAME=${{ env.VALID_USERNAME }}
          VALID_PASSWORD=${{ env.VALID_PASSWORD }}
          HEADLESS=true
          LOG_LEVEL=info
          EOF

      - name: Run smoke tests
        run: npx playwright test --project=chromium --grep @smoke --reporter=list,html
        env:
          CI: true

      # (excerpt showing the changed upload paths)
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report-chromium
          path: |
            playwright-report/
            reports/html/
            reports/junit/
          retention-days: 7

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-screenshots
          path: |
            screenshots/
            playwright-report/screenshots/
          retention-days: 3

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report-${{ matrix.browser }}
          path: |
            playwright-report/
            reports/html/
            reports/junit/
          retention-days: 14

      - name: Upload videos and traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-artifacts-${{ matrix.browser }}
          path: |
            screenshots/
            videos/
            traces/
            playwright-report/
          retention-days: 3

      - name: Upload API test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: |
            playwright-report/
            reports/html/
          retention-days: 7

  # ── Job 2: Full regression — cross-browser ──────────────────────────────────
  test-regression:
    name: Regression Tests — chromium
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test-smoke
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: Create .env file
        run: |
          cat > .env << EOF
          BASE_URL=${{ env.BASE_URL }}
          API_BASE_URL=${{ env.API_BASE_URL }}
          VALID_USERNAME=${{ env.VALID_USERNAME }}
          VALID_PASSWORD=${{ env.VALID_PASSWORD }}
          HEADLESS=true
          LOG_LEVEL=info
          EOF

      - name: Run regression tests
        run: npx playwright test --project=${{ matrix.browser }} --grep @regression
        env:
          CI: true

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report-${{ matrix.browser }}
          path: |
            reports/html/
            reports/junit/
          retention-days: 14

      - name: Upload videos and traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-artifacts-${{ matrix.browser }}
          path: |
            screenshots/
            videos/
            traces/
          retention-days: 3

      - name: Publish JUnit test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results — ${{ matrix.browser }}
          path: reports/junit/results.xml
          reporter: java-junit
          fail-on-error: false

  # ── Job 3: API tests ────────────────────────────────────────────────────────
  test-api:
    name: API Validation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (no browsers needed for API tests)
        run: npx playwright install --with-deps chromium

      - name: Create .env file
        run: |
          cat > .env << EOF
          API_BASE_URL=${{ env.API_BASE_URL }}
          VALID_USERNAME=${{ env.VALID_USERNAME }}
          VALID_PASSWORD=${{ env.VALID_PASSWORD }}
          EOF

      - name: Run API tests
        run: npx playwright test tests/api/ --project=chromium
        env:
          CI: true

      - name: Upload API test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: reports/html/
          retention-days: 7

  # ── Job 4: Publish combined report to GitHub Pages ─────────────────────────
  publish-report:
    name: Publish HTML Report
    runs-on: ubuntu-latest
    needs: [test-smoke, test-regression, test-api]
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports/

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./all-reports
          destination_dir: playwright-reports
